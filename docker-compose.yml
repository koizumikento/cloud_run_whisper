name: cloud-run-whisper

x-api-common: &api_common
  build:
    context: .
    dockerfile: Dockerfile
  image: cloud-run-whisper:local
  ports:
    - "8080:8080"
  environment:
    - XDG_CACHE_HOME=/root/.cache
    - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
  env_file:
    - .env
  volumes:
    - ./.cache:/root/.cache
  restart: unless-stopped

services:
  api:
    <<: *api_common
    container_name: cloud-run-whisper-gpu
    profiles:
      - gpu
    environment:
      - XDG_CACHE_HOME=/root/.cache
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-float16}
    gpus: all

  api-cpu:
    <<: *api_common
    container_name: cloud-run-whisper-cpu
    profiles:
      - cpu
    environment:
      - XDG_CACHE_HOME=/root/.cache
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}

